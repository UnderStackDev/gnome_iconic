[package]
name = "gnome-iconic"
version = "0.2.0"
edition = "2024"
description = "Icon themes and app launchers for GNOME"
license = "MIT"
repository = "https://github.com/UnderStackDev/gnome_iconic"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
anyhow = "1.0.104"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"

[package.metadata.deb]
name = "gnome-iconic"
# 0.1.x was packaged as "iconic", the name of an unrelated app in the AUR;
# this package takes its place on upgrade.
conflicts = "iconic (<< 0.2)"
breaks = "iconic (<< 0.2)"
replaces = "iconic (<< 0.2)"
maintainer = "UnderStackDev <understack_dev@outlook.com>"
license-file = ["LICENSE", "0"]
section = "x11"
depends = "$auto, libarchive-tools, desktop-file-utils, gtk-update-icon-cache"
extended-description = "Pick the icon theme from previews, install themes from archives, and change app launchers."
assets = [
  ["target/release/gnome-iconic", "usr/bin/", "755"],
  ["data/io.github.UnderStackDev.Iconic.desktop", "usr/share/applications/", "644"],
  ["data/io.github.UnderStackDev.Iconic.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["data/io.github.UnderStackDev.Iconic.metainfo.xml", "usr/share/metainfo/", "644"],
]

[package.metadata.generate-rpm]
name = "gnome-iconic"
assets = [
  { source = "target/release/gnome-iconic", dest = "/usr/bin/gnome-iconic", mode = "755" },
  { source = "data/io.github.UnderStackDev.Iconic.desktop", dest = "/usr/share/applications/io.github.UnderStackDev.Iconic.desktop", mode = "644" },
  { source = "data/io.github.UnderStackDev.Iconic.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.UnderStackDev.Iconic.svg", mode = "644" },
  { source = "data/io.github.UnderStackDev.Iconic.metainfo.xml", dest = "/usr/share/metainfo/io.github.UnderStackDev.Iconic.metainfo.xml", mode = "644" },
]

[package.metadata.generate-rpm.requires]
gtk4 = ">= 4.18"
libadwaita = ">= 1.8"
bsdtar = "*"
desktop-file-utils = "*"
gtk-update-icon-cache = "*"

[package.metadata.generate-rpm.obsoletes]
iconic = "< 0.2"
